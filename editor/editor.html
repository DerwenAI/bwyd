<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
      >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      >

    <link rel="stylesheet" href="editor.css">

    <title>Bwyd Editor</title>
  </head>

  <body>
    <div id="main" class="container-fluid">
      <main>
	<div class="container">

	  <div class="editor">
	    <h1>Bwyd Editor</h1>

	    <div class="field">
	      <label for="doc-title">Title</label>
	      <input type="text" id="doc-title" placeholder="My Recipe">
	    </div>

	    <div class="field url-field">
	      <label for="doc-source">Source</label>
	      <input type="url" id="doc-source" placeholder="https://example.com">
	    </div>

	    <div class="field">
	      <label>Keywords</label>
	      <div class="tag-box" id="kw-box">
		<input type="text" class="tag-input" id="kw-input" placeholder="Add a keyword…">
	      </div>
	      <div class="hint">Press <strong>Enter</strong> or <strong>,</strong> to add — <strong>Backspace</strong> to remove</div>
	    </div>

	    <!-- Activities -->
	    <div class="activities-header">
	      <h2>Activities</h2>
	      <button class="btn btn--primary" id="add-activity-btn">+</button>
	    </div>
	    <div id="activities-container">
	      <div class="empty-state" id="empty-msg">No activities yet. Click <strong>+</strong> to get started.</div>
	    </div>

	    <!-- JSON Output -->
	    <div class="output-section">
	      <div class="output-header">
		<label>JSON:</label>
		<button class="btn btn--ghost btn--sm copy-btn" id="copy-btn">Copy</button>
	      </div>
	      <pre id="json-output"></pre>
	    </div>
	  </div>

	</div>

	<footer>
	  <div id="footer">
	    <div id="footer-content">
	      <br>
	      <p>
		powered by
		<a
		  href="https://github.com/DerwenAI/bwyd"
		  target="_blank"
		  >Bwyd</a>
	      </p>
	    </div>
          </div>
	</footer>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
      ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
      ></script>

    <script src="editor.js"></script>
  </body>
</html>
